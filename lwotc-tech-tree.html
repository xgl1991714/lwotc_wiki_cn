<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LWOTC 科技树</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111820; --panel2:#0d141b; --line:#24303d;
    --text:#e6edf3; --muted:#8b98a5; --accent:#f0b429; --accent2:#58a6ff;
    --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden;
  }
  button,input{font:inherit}
  .topbar{
    height:64px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:0 20px; background:linear-gradient(180deg,#121a23,#0e151c);
    border-bottom:1px solid var(--line);
  }
  .topbar h1{margin:0; font-size:19px; letter-spacing:.5px; font-weight:650}
  .topbar .sub{margin:3px 0 0; color:var(--muted); font-size:12px}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .btn{
    background:#17212b; color:var(--text); border:1px solid #2b3948;
    padding:7px 11px; border-radius:7px; cursor:pointer; font-size:12px;
  }
  .btn:hover{border-color:#486178; background:#1b2834}
  .btn.primary{border-color:#6b5320; color:#ffd479; background:#2a2112}
  .layout{
    height:calc(100vh - 64px); display:grid;
    grid-template-columns:270px minmax(0,1fr) 360px;
  }
  .sidebar{
    background:var(--panel); border-right:1px solid var(--line);
    overflow:auto; padding:14px;
  }
  .details{
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .detail-head{
    flex:0 0 auto; padding:14px 16px 12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#121a23,#0f171f);
  }
  .detail-head:empty{display:none}
  .detail-body{
    flex:1 1 auto; min-height:0; overflow:auto;
    padding:12px 16px 18px;
  }
  .search-wrap{position:relative; margin-bottom:12px}
  .search-wrap input{
    width:100%; padding:9px 30px 9px 10px; border-radius:8px;
    background:#0b1218; border:1px solid #2b3948; color:var(--text); outline:none;
  }
  .search-wrap input:focus{border-color:#586f86}
  .search-wrap .clear{
    position:absolute; right:6px; top:6px; border:0; background:transparent;
    color:var(--muted); cursor:pointer; font-size:16px; line-height:1;
    padding:3px 6px; display:none;
  }
  .search-results{
    display:none; margin:-2px 0 12px; border:1px solid #24303d;
    border-radius:8px; background:#0c131a; overflow:hidden;
  }
  .search-head{
    padding:7px 9px; color:var(--muted); font-size:10.5px;
    border-bottom:1px solid #1c2834; display:flex; justify-content:space-between;
  }
  .search-list{max-height:300px; overflow:auto}
  .result-item{
    display:flex; align-items:center; gap:8px; width:100%;
    padding:7px 9px; border:0; border-bottom:1px solid #16212c;
    background:transparent; color:var(--text); text-align:left; cursor:pointer;
  }
  .result-item:last-child{border-bottom:0}
  .result-item:hover{background:#16232f}
  .result-item .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
  .result-main{min-width:0; flex:1 1 auto}
  .result-title{display:block; font-size:12px; color:#e2ebf4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .result-sub{display:block; font-size:9.5px; color:#7f91a3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .result-meta{flex:0 0 auto; text-align:right; color:#f0b429; font-size:9.5px; line-height:1.45}
  .result-empty{padding:10px; color:var(--muted); font-size:11px}
  .section-title{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin:16px 0 8px; color:var(--muted); font-size:11px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .section-title .mini-actions{display:flex; gap:6px}
  .mini{
    border:1px solid #2b3948; background:#0f171f; color:var(--muted);
    border-radius:5px; padding:2px 7px; font-size:11px; cursor:pointer;
  }
  .mini:hover{color:var(--text); border-color:#486178}
  .filter{
    display:flex; align-items:center; gap:8px; padding:6px 4px;
    border-radius:6px; cursor:pointer; font-size:12.5px;
  }
  .filter:hover{background:#141e28}
  .filter input{accent-color:var(--accent); width:14px; height:14px}
  .filter .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .filter .count{margin-left:auto; color:var(--muted); font-size:11px}
  .legend{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); padding:3px 0}
  .legend-item .dot{width:8px; height:8px; border-radius:50%}
  .note{margin-top:14px; color:var(--muted); font-size:11px; line-height:1.65}
  .note b{color:#b8c7d6; font-weight:600}
  .nw{white-space:nowrap}
  .graph-wrap{position:relative; overflow:hidden; background:
    radial-gradient(1200px 700px at 45% 20%, #101924 0%, #0b1117 55%, #080c10 100%);}
  #graph{width:100%; height:100%; display:block; touch-action:none; cursor:grab;
    user-select:none; -webkit-user-select:none; outline:none}
  #graph text, .node{user-select:none; -webkit-user-select:none}
  #graph.dragging, #graph.dragging .node{cursor:grabbing}
  .hint{
    position:absolute; left:14px; bottom:12px; color:#66798b; font-size:11px;
    background:rgba(8,13,18,.72); padding:5px 8px; border-radius:5px;
    pointer-events:none;
  }
  .tier-label{fill:#5f7183; font-size:11px; letter-spacing:1.5px; font-weight:600}
  .edge{
    fill:none; stroke:#2d3b4a; stroke-width:1.15; opacity:.9;
    pointer-events:none; transition:opacity .12s, stroke .12s, stroke-width .12s;
  }
  .edge.hot{stroke:var(--accent); stroke-width:2.3; opacity:1}
  .edge.dim{opacity:.08}
  .node{cursor:pointer}
  .node .node-bg{
    fill:#121b24; stroke:#2c3b4a; stroke-width:1.15;
    transition:stroke .12s, filter .12s, opacity .12s;
  }
  .node:hover .node-bg{stroke:#6e8aa3; filter:drop-shadow(0 0 5px rgba(88,166,255,.25))}
  .node.selected .node-bg{stroke:var(--accent); stroke-width:2.5; filter:drop-shadow(0 0 7px rgba(240,180,41,.35))}
  .node.related .node-bg{stroke:#4f7fa8}
  .node.match:not(.selected) .node-bg{stroke:var(--accent2); stroke-width:1.8}
  .node.dim{opacity:.17}
  .node .node-stripe{opacity:.95}
  .node-title{fill:#e6edf3; font-size:13px; font-weight:650; pointer-events:none}
  .node-sub{fill:#7f91a3; font-size:9.5px; pointer-events:none}
  .node-cost{fill:#f0b429; font-size:10.5px; font-weight:600; pointer-events:none}
  .node-meta{fill:#8b98a5; font-size:9px; pointer-events:none}
  .cat-base .node-stripe{fill:#8fa3bf}
  .cat-weapon .node-stripe{fill:#e07a5f}
  .cat-armor .node-stripe{fill:#4f9da6}
  .cat-autopsy .node-stripe{fill:#8ac926}
  .cat-psi .node-stripe{fill:#b28dff}
  .cat-proving .node-stripe{fill:#f2b134}
  .cat-item .node-stripe{fill:#d98cb3}
  .cat-story .node-stripe{fill:#6ec6ff}
  .cat-hidden .node-stripe{fill:#6c757d}
  .details{font-size:12.5px; line-height:1.55}
  .details h2{margin:0 0 4px; font-size:18px; line-height:1.3}
  .title-row{display:flex; align-items:flex-start; gap:10px; justify-content:space-between}
  .title-row h2{flex:1 1 auto; min-width:0; margin:0}
  .title-row .badges{flex:0 1 auto; justify-content:flex-end; margin:0; max-width:58%}
  .details .internal{color:var(--muted); font-size:11px; word-break:break-all}
  .badges{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
  .badge{
    border:1px solid #2b3948; background:#0f171f; color:#aebdcc;
    border-radius:999px; padding:3px 8px; font-size:11px;
  }
  .badge.gold{color:#ffd479; border-color:#6b5320; background:#241b0d}
  .kv{display:grid; grid-template-columns:82px minmax(0,1fr); gap:6px 10px; margin:12px 0}
  .kv .k{color:var(--muted)}
  .kv .v{color:#d6e2ee; word-break:break-word}
  .detail-foot{
    margin:10px -16px -12px; padding:7px 12px;
    border-top:1px solid var(--line); background:#0d151d;
    color:var(--muted); font-size:11.5px; line-height:1.5;
  }
  .detail-foot b{color:#f0b429; font-weight:600}
  .details h3{margin:18px 0 7px; color:var(--muted); font-size:11px; letter-spacing:1px; text-transform:uppercase}
  .detail-body > h3:first-child{margin-top:2px}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    border:1px solid #2b3948; background:#0f171f; color:#b9c9d8;
    border-radius:6px; padding:4px 7px; font-size:11px; cursor:pointer;
  }
  .chip:hover{border-color:#5e7b94; color:#fff}
  .summary{white-space:pre-wrap; color:#b9c7d5; margin:8px 0 0}
  .item-card{
    border:1px solid #263442; background:#0d151d; border-radius:7px;
    padding:7px 9px; margin:5px 0;
  }
  .item-card.free{border-color:#5a471f; background:#19150c}
  .item-card.combo{border-color:#3c3155; background:#14101d}
  .item-name{color:#dce7f1; font-size:12px; font-weight:600}
  .item-id{color:#71859a; font-size:9.5px; word-break:break-all; margin-top:1px}
  .item-meta{color:#9fb1c2; font-size:10.5px; margin-top:4px; line-height:1.5}
  .item-note{color:#a78bfa; font-size:10px; margin-top:3px}
  .item-free-tag{color:#f0b429; font-size:10px; margin-left:5px}
  .muted{color:var(--muted)}
  .overview p{color:#aebdcc}
  .overview .big{font-size:28px; color:var(--accent); font-weight:650; margin:6px 0 0}
  .overview .small{color:var(--muted); font-size:11px}
  .detail-body::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:9px}
  .detail-body::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:#263442; border-radius:5px}
  @media (max-width:1250px){
    .layout{grid-template-columns:235px minmax(0,1fr) 310px}
  }
  @media (max-width:980px){
    .layout{grid-template-columns:210px minmax(0,1fr)}
    .details{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1>LWOTC 科技树</h1>
    <p class="sub">Long War of the Chosen · 研究依赖图 · <span id="stats">载入中…</span></p>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="btn-fit">适应窗口</button>
    <button class="btn" id="btn-reset">重置视图</button>
    <button class="btn" id="btn-zoom-in">＋</button>
    <button class="btn" id="btn-zoom-out">－</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="模糊搜索科技 / 物品名 / 内部名…" autocomplete="off">
      <button class="clear" id="search-clear" title="清除">×</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="section-title"><span>分类筛选</span><span class="mini-actions">
      <button class="mini" id="btn-main">主线</button>
      <button class="mini" id="btn-all">全部</button>
    </span></div>
    <div id="filters"></div>
    <div class="legend" id="legend"></div>
    <div class="note">
      <b>数据源</b><br>
      LongWarOfTheChosen/Config/XComLW_Overhaul.ini<br>
      <b>依赖</b>：PrereqTech1-3；<b>成本</b>：研究点 + <span class="nw">补给/情报/合金/水晶/核心</span><br>
      <b>中文名</b>：XCOM2 本体 + DLC + SDK + LWOTC 本地化，缺失时用英文/内部名<br>
      <span id="build"></span>
    </div>
  </aside>
  <main class="graph-wrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#3b4b5c"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="tiers"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="hint">滚轮缩放 · 任意处拖拽平移 · 点击节点查看详情 · 双击空白适应窗口</div>
  </main>
  <aside class="details" id="details">
    <div class="detail-head" id="detail-head"></div>
    <div class="detail-body" id="detail-body"></div>
  </aside>
</div>
<script>
const TECHS = [{"id":"AutopsyAdventPsiWitch","name":"AutopsyAdventPsiWitch","display":"解剖化身","en":"Avatar Autopsy","summary":"外星人建造了一个复杂的社会，政治体系和控制系统来滋养这种生物，也就是他们所谓的\"化身\"。在牺牲了无数人类后他们终于成功了。","cat":"autopsy","pg":false,"mod":true,"cost":5000,"science":0,"engineering":0,"supply":0,"intel":0,"alloy":0,"crystal":0,"core":0,"prereqs":[],"unlocks":[],"free_items":[],"build_items":[],"combo_items":[],"req_items":[],"depth":0},{"id":"AlienBiotech","name":"AlienBiotech","display":"外星生化技术","en":"Alien Biotech","summary":"在成功地进行了移除变种人芯片植入的外科疗程后，我们现在有机会可以进一步了解其内部的工作原理，以此能更好地研究他们的动机。","cat":"base","pg":false,"mod":false,"cost":1300,"science":5,"engineering":0,"supply":0,"intel":0,"alloy":0,"crystal":0,"core":0,"prereqs":[],"unlocks":["AutopsyAdventTrooper","AutopsyAndromedon","AutopsyArchon","AutopsyChryssalid","AutopsyFaceless","AutopsyMuton","AutopsySectoid","AutopsySpectre","AutopsyViper","HazmatVestProject"],"free_items":[],"build_items":["APRounds"],"combo_items":[],"req_items":[],"depth":0},{"id":"HybridMaterials","name":"HybridMaterials","display":"混合材料","en":"Hybrid Materials","summary":"我们目前回收到的变种人尸体被一种迷人的材料混合物防护着。有一些看起来非常普通。通过学习潜在的外星人科技，我们的武器研究将会取得重大的突破。","cat":"base","pg":false,"mod":false,"cost":2000,"science":5,"engineering":0,"supply":0,"intel":0,"alloy":5,"crystal":3,"core":0,"prereqs":[],"unlocks":["AcidGrenadeProject","AlloyPlatingProject","AutopsyDrone","BattlescannerProject","BluescreenRoundsProject","CarapacePlatingProject","ChameleonSuitProject","ChitinPlatingProject","DragonRoundsProject","FalconRoundsProject","FlechetteRoundsProject","GasGrenadeProject","HazmatVestProject","HellweaveProject","IncendiaryGrenadeProject","LaserWeapons","MagnetizedWeapons","NeedleRoundsProject","PlasmaGrenade","PlatedArmor","PlatedVestProject","RedscreenRoundsProject","StasisVestProject","StilettoRoundsProject","TalonRoundsProject","Tech_Elerium","VenomRoundsProject"],"free_items":["NanofiberVest"],"build_items":["NanofiberVest","TracerRounds"],"combo_items":[],"req_items":[], function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function trunc(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}
function fmtCost(n) {
  n = Number(n) || 0;
  if (n >= 1000) {
    const v = n / 1000;
    return (Math.round(v * 10) / 10) + "k";
  }
  return String(n);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function peopleNeeded(score) {

  return String(Math.ceil(n / 5));

function isSubsequence(haystack, needle) {
  let i = 0;
  for (let j = 0; j < haystack.length && i < needle.length; j++) {
    if (haystack[j] === needle[i]) i++;
  }
  return i === needle.length;
}

  const fields = techSearchFields(t);
  let total = 0;
  for (const token of tokens) {
    let best = -1;
    for (const f of fields) {
      let s = -1;
      if (f === token) s = 100;
      else if (f.startsWith(token)) s = 80;
      else if (f.includes(token)) s = 60;
      else if (token.length >= 2 && isSubsequence(f, token)) s = 25;
      if (s > best) best = s;
    }
    if (best < 0) return -1;
    total += best;
  }
  const display = normalizeSearch(t.display);
  const id = normalizeSearch(t.id);
  if (display.includes(q)) total += 30;
  else if (id.includes(q)) total += 15;
  return total;
}
function searchMatches(query) {
  const q = normalizeSearch(query);
  if (!q) return [];
  return TECHS.map(t => ({ t: t, score: fuzzyScore(t, q) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score || a.t.display.localeCompare(b.t.display, "zh-CN"))
    .map(x => x.t);
}
function renderSearchResults() {
  const q = normalizeSearch(searchEl.value);
  if (!q) {
    searchResultsEl.style.display = "none";
    searchResultsEl.innerHTML = "";
    return;
  }
  const matches = searchMatches(q);
  searchResultsEl.style.display = "block";
  if (!matches.length) {
    searchResultsEl.innerHTML =
      '<div class="search-head"><span>无匹配</span><span>换个关键字</span></div>';
    return;
  }
  const shown = matches.slice(0, 50);
  const rows = shown.map(t => {
    const freeN = (t.free_items || []).length;
    const buildN = (t.build_items || []).length;
    const comboN = (t.combo_items || []).length;
    const effects = [];
    if (freeN) effects.push("免费" + freeN);
    if (buildN) effects.push("解锁" + buildN);
    if (comboN) effects.push("组合" + comboN);
    return '<button class="result-item" data-result="' + esc(t.id) + '">' +
      '<span class="dot" style="background:' + CATS[t.cat].color + '"></span>' +
      '<span class="result-main">' +
      '<span class="result-title">' + esc(t.display) + "</span>" +
      '<span class="result-sub">' + esc(t.id) + " · " + esc(CATS[t.cat].label) + "</span>" +
      "</span>" +
      '<span class="result-meta">' + esc(t.cost ? fmtCost(t.cost) : "") +
      (effects.length ? "<br>" + esc(effects.join(" · ")) : "") + "</span>" +
      "</button>";
  }).join("");
  searchResultsEl.innerHTML =
    '<div class="search-head"><span>匹配 ' + matches.length + ' 项</span><span>点击结果选中</span></div>' +
    '<div class="search-list">' + rows + "</div>" +
    (matches.length > shown.length ? '<div class="result-empty">仅显示前 ' + shown.length + ' 项，请补充关键字</div>' : "");
}

function visibleSet() {
  const s = new Set();
  TECHS.forEach(t => { if (state.cats.has(t.cat)) s.add(t.id); });
  return s;
}

/* ---------- layout ---------- */
function computeLayout() {
  const visSet = visibleSet();
  const vis = TECHS.filter(t => visSet.has(t.id));
  const memo = {};
  const visiting = new Set();
  function depth(id) {
    if (memo[id] != null) return memo[id];
    if (visiting.has(id)) return 0;
    visiting.add(id);
    let d = 0;
    for (const p of byId[id].prereqs) {
      if (visSet.has(p)) d = Math.max(d, depth(p) + 1);
    }
    visiting.delete(id);
    memo[id] = d;
    return d;
  }
  vis.forEach(t => depth(t.id));

  const groups = new Map();
  vis.forEach(t => {
    const d = memo[t.id] || 0;
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(t);
  });
  const catIndex = {};
  CAT_ORDER.forEach((c, i) => { catIndex[c] = i; });
  const depths = Array.from(groups.keys()).sort((a, b) => a - b);
  const maxDepth = depths.length ? depths[depths.length - 1] : 0;
  const maxRows = Math.max(1, ...depths.map(d => groups.get(d).length));

  const nodeW = 236, nodeH = 58, colW = 300, rowH = 74, x0 = 60, y0 = 82;
  const nodes = [];
  depths.forEach(d => {
    const arr = groups.get(d).slice().sort((a, b) =>
      (catIndex[a.cat] - catIndex[b.cat]) || a.display.localeCompare(b.display, "zh-CN"));
    arr.forEach((t, i) => {
      nodes.push({
        ...t,
        x: x0 + d * colW,
        y: y0 + i * rowH,
        depth: d
      });
    });
  });
  const pos = {};
  nodes.forEach(n => { pos[n.id] = n; });
  const edges = [];
  vis.forEach(t => {
    t.prereqs.forEach(p => {
      if (visSet.has(p) && pos[p] && pos[t.id]) edges.push({ from: p, to: t.id });
    });
  });
  const W = x0 + (maxDepth + 1) * colW + 70;
  const H = y0 + maxRows * rowH + 46;
  return { nodes, edges, W, H, maxDepth, maxRows, vis };
}

/* ---------- render ---------- */
function render(shouldFit) {
  const layout = computeLayout();
  state.layout = layout;
  const { nodes, edges, W, H } = layout;
  const pos = {};
  nodes.forEach(n => { pos[n.id] = n; });

      '<title>' + esc(title) + "</title>" +

  });

  updateStats(layout);

  statsEl.textContent = layout.vis.length + "/" + TECHS.length + " 项 · " +

/* ---------- highlight ---------- */
function relatedIds(id) {
  const out = new Set([id]);
  const vis = visibleSet();
  function up(x) {
    for (const p of byId[x].prereqs) {
      if (vis.has(p) && !out.has(p)) { out.add(p); up(p); }
    }
  }
  function down(x) {
    for (const c of (byId[x].unlocks || [])) {
      if (vis.has(c) && !out.has(c)) { out.add(c); down(c); }
    }
  }
  up(id); down(id);
  return out;
}

function applyHighlight() {
  const focus = state.selected || state.hover;
  const rel = focus ? relatedIds(focus) : null;

  document.querySelectorAll(".node").forEach(el => {
    const id = el.dataset.id;
    const t = byId[id];
    if (!t) return;
    let dim = false;
    if (rel && !rel.has(id)) dim = true;
    el.classList.toggle("selected", id === state.selected);
    el.classList.toggle("related", !!(rel && rel.has(id) && id !== state.selected));
    el.classList.toggle("dim", dim);
  });

  document.querySelectorAll(".edge").forEach(el => {
    const a = el.dataset.from, b = el.dataset.to;
    let hot = false, dim = false;
    if (rel) {
      hot = rel.has(a) && rel.has(b);
      dim = !hot;
    }
    el.classList.toggle("hot", hot);
    el.classList.toggle("dim", dim);
  });
}

function selectNode(id, center) {

/* 把节点平移到画布中央（从搜索列表/详情面板选中时用）。
   动画放进 rAF 里跑：ensureVisible() 触发重绘时会顺手排一个 fitView，
   同一帧里 fitView 先执行，这里的首帧后执行，才不会被它覆盖。 */
let viewAnim = 0;
function cancelViewAnim() {
  if (viewAnim) { cancelAnimationFrame(viewAnim); viewAnim = 0; }
}
function easeInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function centerOnNode(id, animate) {
  const n = (state.layout && state.layout.nodes || []).find(x => x.id === id);
  if (!n) return;
  const rect = svg.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const nx = n.x + 118, ny = n.y + 29;       // 节点中心（卡片 236×58）
  const cx = rect.width / 2, cy = rect.height / 2;
  state.userMoved = true;
  cancelViewAnim();
  const reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = animate === false || reduce ? 0 : 320;
  let from = null, t0 = 0, s1 = 0;
  const step = now => {
    if (!from) {
      // 首帧才采样起点：这样前面排队的 fitView 已经生效
      from = {
        s: state.view.s,
        px: state.view.x + state.view.s * nx,
        py: state.view.y + state.view.s * ny
      };
      s1 = Math.max(from.s, 0.55);   // 已经放大的视图不缩回去
      t0 = now;
    }
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = easeInOut(k);
    const s = from.s + (s1 - from.s) * e;
    state.view.s = s;
    state.view.x = from.px + (cx - from.px) * e - s * nx;
    state.view.y = from.py + (cy - from.py) * e - s * ny;
    applyView();
    viewAnim = k < 1 ? requestAnimationFrame(step) : 0;
  };
  viewAnim = requestAnimationFrame(step);
}

/* ---------- view / pan / zoom ---------- */
function applyView() {
  viewport.setAttribute("transform",
    "translate(" + state.view.x + " " + state.view.y + ") scale(" + state.view.s + ")");
}
function fitView() {
  const rect = svg.getBoundingClientRect();
  if (!state.layout || !rect.width || !rect.height) return;
  const { W, H } = state.layout;
  const s = Math.min((rect.width - 40) / W, (rect.height - 40) / H, 1);
  state.view = {
    s: s,
    x: (rect.width - W * s) / 2,
    y: (rect.height - H * s) / 2
  };
  state.userMoved = false;
  applyView();
}
function zoomAt(factor, cx, cy) {
  cancelViewAnim();
  const rect = svg.getBoundingClientRect();
  const mx = cx == null ? rect.width / 2 : cx - rect.left;
  const my = cy == null ? rect.height / 2 : cy - rect.top;
  const ns = clamp(state.view.s * factor, 0.08, 3.5);
  state.view.x = mx - (mx - state.view.x) * (ns / state.view.s);
  state.view.y = my - (my - state.view.y) * (ns / state.view.s);
  state.view.s = ns;
  state.userMoved = true;
  applyView();
}

let drag = null;
let dragMoved = false;
let suppressClick = false;  // 平移结束后浏览器补发的 click 不该选中/取消选中任何东西
const DRAG_SLOP = 4;        // 位移在这个半径（px）内仍算点击，不算拖动
function endDrag() {
  if (!drag) return;
  if (dragMoved) suppressClick = true;
  drag = null;
  dragMoved = false;
  svg.classList.remove("dragging");
}
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  // 每次手势开始都重置，否则上一次平移留下的标记会吃掉这一击
  dragMoved = false;
  suppressClick = false;
  cancelViewAnim();
  const onNode = !!(e.target.closest && e.target.closest(".node"));
  drag = {
    x: e.clientX, y: e.clientY,
    ox: state.view.x, oy: state.view.y,
    pid: e.pointerId,
    captured: !onNode
  };
  // 从节点上起手时先不抓 pointer：一旦 setPointerCapture，
  // 连普通点击的 click 都会重定向到 <svg>，节点就永远选不中。
  // 等真正越过阈值再抓，那时这个 click 本来也要被丢掉。
  if (drag.captured) {
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("dragging");
  }
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && dx * dx + dy * dy > DRAG_SLOP * DRAG_SLOP) {
    dragMoved = true;
    if (!drag.captured) {
      drag.captured = true;
      svg.setPointerCapture(drag.pid);
    }
    svg.classList.add("dragging");
  }
  if (!dragMoved) return;
  state.view.x = drag.ox + dx;
  state.view.y = drag.oy + dy;
  state.userMoved = true;
  applyView();
});
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });
svg.addEventListener("dblclick", e => {
  if (e.target.closest && e.target.closest(".node")) return;
  cancelViewAnim();
  fitView();
});

/* ---------- events ---------- */
/* 挂在 <svg> 而不是 <g id="viewport">：点空白处时事件目标是 <svg> 自身，
   它不会冒泡经过 viewport，所以之前点空白既不会取消选中，也不会清掉平移标记。 */
svg.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; return; }
  const g = e.target.closest ? e.target.closest(".node") : null;
  if (g) {
    selectNode(g.dataset.id);
  } else {
    state.selected = null;
    showDetails(null);
    applyHighlight();
  }
});
viewport.addEventListener("pointerover", e => {
  const g = e.target.closest ? e.target.closest(".node") : null;
  if (g) {
    state.hover = g.dataset.id;
    applyHighlight();
  }
});
viewport.addEventListener("pointerout", e => {
  const g = e.target.closest ? e.target.closest(".node") : null;
  if (g && (!e.relatedTarget || !g.contains(e.relatedTarget))) {
    state.hover = null;
    applyHighlight();
  }
});

detailsEl.addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest("[data-goto]") : null;
  if (!b) return;
  selectNode(b.dataset.goto, true);
});

searchEl.addEventListener("input", () => {
  state.query = searchEl.value;
  clearEl.style.display = state.query ? "block" : "none";
  renderSearchResults();
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    searchEl.value = "";
    state.query = "";
    clearEl.style.display = "none";
    renderSearchResults();
  }
});
clearEl.addEventListener("click", () => {
  searchEl.value = "";
  state.query = "";
  clearEl.style.display = "none";
  renderSearchResults();
  searchEl.focus();
});
searchResultsEl.addEventListener("click", e => {
  const row = e.target.closest ? e.target.closest("[data-result]") : null;
  if (!row) return;
  selectNode(row.dataset.result, true);
});

document.getElementById("btn-fit").addEventListener("click", () => {
  cancelViewAnim();
  fitView();
});
document.getElementById("btn-reset").addEventListener("click", () => {
  cancelViewAnim();
  fitView();
});
document.getElementById("btn-zoom-in").addEventListener("click", () => zoomAt(1.2));
document.getElementById("btn-zoom-out").addEventListener("click", () => zoomAt(1 / 1.2));
document.getElementById("btn-main").addEventListener("click", () => {
  state.cats = new Set(CAT_ORDER.filter(c => c !== "hidden"));
  syncChecks();
  if (state.selected && !state.cats.has(byId[state.selected].cat)) state.selected = null;
  render(true);
});
document.getElementById("btn-all").addEventListener("click", () => {
  state.cats = new Set(CAT_ORDER);
  syncChecks();
  render(true);
});

window.addEventListener("resize", () => {
  if (!state.userMoved) fitView();
});

/* ---------- init ---------- */
showDetails(null);
render(true);
applyView();
const initialQuery = new URLSearchParams(location.search).get("q");
if (initialQuery) {
  searchEl.value = initialQuery;
  state.query = initialQuery;
  clearEl.style.display = "block";
  renderSearchResults();
}
const initialHash = decodeURIComponent(location.hash.slice(1));
if (initialHash && byId[initialHash]) {
  selectNode(initialHash, true);
}
</script>
</body>
</html>
